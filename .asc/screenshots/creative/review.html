<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FarrierFlow creative proof — Slides 01 and 03</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 56px;
        background: #171614;
        color: #f4efe7;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      }
      header { max-width: 1100px; margin: 0 auto 64px; }
      h1 { margin: 0 0 14px; font-size: 44px; letter-spacing: -0.035em; }
      header p { margin: 0; color: #aaa39b; font-size: 19px; }
      section { max-width: 1500px; margin: 0 auto 88px; }
      h2 { margin: 0 0 22px; font-size: 28px; letter-spacing: -0.02em; }
      .comparison { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px; }
      figure { margin: 0; }
      figcaption {
        margin-bottom: 12px;
        color: #aaa39b;
        font-size: 15px;
        font-weight: 650;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      img { display: block; width: 100%; height: auto; border-radius: 18px; box-shadow: 0 24px 60px rgba(0,0,0,.32); }
      @media (max-width: 900px) {
        body { padding: 28px; }
        .comparison { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>FarrierFlow creative proof</h1>
      <p>Owner-provided Figma baseline beside the revised proof. Slides 01 and 03 only.</p>
    </header>
    <section>
      <h2>01 · Today run sheet</h2>
      <div class="comparison">
        <figure><figcaption>Actual Figma baseline · 01-today-run-sheet.jpg</figcaption><img src="../baseline/01-today-run-sheet.jpg" alt="Owner-provided Figma Slide 01 baseline"></figure>
        <figure><figcaption>Revised proof</figcaption><img src="../new/01-today-run-sheet.png" alt="Revised Slide 01 creative proof"></figure>
      </div>
    </section>
    <section>
      <h2>03 · Work to invoice</h2>
      <div class="comparison">
        <figure><figcaption>Actual Figma source · 06-work-to-invoice.jpg</figcaption><img src="../baseline/03-work-to-invoice.jpg" alt="Owner-provided Figma work-to-invoice baseline"></figure>
        <figure><figcaption>Revised proof</figcaption><img src="../new/03-work-to-invoice.png" alt="Revised Slide 03 creative proof"></figure>
      </div>
    </section>
  </body>
</html>
