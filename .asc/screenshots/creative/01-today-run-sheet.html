<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="field-book.css">
    <title>FarrierFlow — Today run sheet proof</title>
  </head>
  <body>
    <main class="canvas canvas--today">
      <header class="hero-copy today-copy" data-kou-id="headline">
        <h1>
          <span>{{headline_line_one}}</span>
          <span>{{headline_line_two}}</span>
        </h1>
        <p>{{supporting_line}}</p>
      </header>

      <div class="device-hardware today-device" data-kou-id="today-screen">
        <img class="device-art" src="{{screen}}" alt="FarrierFlow Today run sheet">
      </div>
    </main>
  </body>
</html>
