<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="field-book.css">
    <title>FarrierFlow — Work to invoice proof</title>
  </head>
  <body>
    <main class="canvas canvas--invoice">
      <header class="hero-copy invoice-copy" data-kou-id="headline">
        <h1>{{headline}}</h1>
        <p>{{supporting_line}}</p>
      </header>

      <div class="device-hardware invoice-device" data-kou-id="invoice-screen">
        <img class="device-art" src="{{invoice_screen}}" alt="FarrierFlow Invoice 0148">
      </div>
    </main>
  </body>
</html>
