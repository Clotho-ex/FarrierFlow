<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="field-book.css">
    <link rel="stylesheet" href="batch-slide.css">
    <title>FarrierFlow — screenshot proof</title>
  </head>
  <body>
    <main class="canvas canvas--batch canvas--{{variant}}">
      <header class="hero-copy batch-copy" data-kou-id="headline">
        <h1><span>{{headline_line_one}}</span><span>{{headline_line_two}}</span></h1>
        <p><span>{{supporting_line_one}}</span><span>{{supporting_line_two}}</span></p>
      </header>
      <div class="device-hardware batch-device" data-kou-id="app-screen">
        <img class="device-art" src="{{screen}}" alt="{{screen_description}}">
      </div>
    </main>
  </body>
</html>
