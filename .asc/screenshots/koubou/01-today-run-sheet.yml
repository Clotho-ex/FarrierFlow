project:
  name: "FarrierFlow 01 Today Run Sheet"
  output_dir: "../../../output/screenshots/koubou"
  device: "iPhone 17 Pro Max - Silver - Portrait"
  output_size: "iPhone6_9"
defaults:
  background:
    type: "linear"
    colors: ["#F4F0EB", "#C9D4C3"]
    direction: 180
screenshots:
  01-today-run-sheet:
    content:
      - { type: "text", content: "Your whole workday. One run sheet.", position: ["50%", "8%"], size: 76, max_width: 1120, max_lines: 2, color: "#24211E", weight: "bold" }
      - { type: "text", content: "Barns. Horses. Next stops.", position: ["50%", "15%"], size: 38, color: "#5F5953" }
      - { type: "image", asset: "../../../output/screenshots/raw/01-today-run-sheet.png", position: ["50%", "61%"], scale: 0.72, frame: true }
